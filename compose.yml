services:
  db:
    image: postgres:16-alpine
    container_name: clockin-postgres
    environment:
      POSTGRES_DB: clockin
      POSTGRES_USER: clockin_user
      POSTGRES_PASSWORD: change-this-local-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clockin_user -d clockin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: